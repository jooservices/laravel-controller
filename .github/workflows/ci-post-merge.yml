# Dedicated CI for jooservices/laravel-controller — GitHub-hosted runners
# Post-merge sanity on master/develop heads. Full PR gate lives in ci.yml.
name: CI post-merge

on:
  push:
    branches: [master, develop]

concurrency:
  group: ci-post-merge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Cache Composer vendor
        uses: actions/cache@v6
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Composer validate
        run: tools/ci/docker-compose run --rm php composer validate --strict

  test:
    name: Test (${{ matrix.name }})
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Laravel 12
            laravel: '12'
            testbench: '^10.0'
            coverage: true
          - name: Laravel 13
            laravel: '13'
            testbench: '^11.0'
            coverage: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Cache Composer vendor
        uses: actions/cache@v6
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-laravel${{ matrix.laravel }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-laravel${{ matrix.laravel }}-
            composer-vendor-

      - name: Install dependencies
        run: |
          tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist
          tools/ci/docker-compose run --rm php composer require --no-update \
            "illuminate/console:^${{ matrix.laravel }}.0" \
            "illuminate/http:^${{ matrix.laravel }}.0" \
            "illuminate/routing:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0"
          tools/ci/docker-compose run --rm php composer require --no-update --dev \
            "orchestra/testbench:${{ matrix.testbench }}"
          tools/ci/docker-compose run --rm php composer update --prefer-dist --no-interaction

      - name: Run tests with coverage
        if: matrix.coverage
        run: |
          mkdir -p build/coverage
          tools/ci/docker-compose run --rm php ./vendor/bin/phpunit \
            --coverage-clover=build/coverage/clover-Laravel${{ matrix.laravel }}.xml

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: tools/ci/docker-compose run --rm php ./vendor/bin/phpunit --no-coverage

      - name: Upload coverage artifact
        if: matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-post-merge-Laravel${{ matrix.laravel }}
          path: build/coverage/clover-Laravel${{ matrix.laravel }}.xml
          if-no-files-found: error

  coverage:
    name: Coverage upload
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-post-merge-*
          path: build/coverage/matrix
          merge-multiple: true

      - name: Enforce coverage and prepare Clover report
        run: |
          tools/ci/docker-compose run --rm php php tools/coverage-enforce.php build/coverage/matrix/clover-Laravel12.xml
          mkdir -p build/coverage
          cp build/coverage/matrix/clover-Laravel12.xml build/coverage/clover-combined.xml
          ls -la build/coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/clover-combined.xml
          fail_ci_if_error: true
          verbose: true

      - name: Resolve SonarQube host URL
        id: sonar-config
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          host_url="${SONAR_HOST_URL:-https://sonarcloud.io}"
          host_url="${host_url%/}"
          case "${host_url}" in
            http://*|https://*) ;;
            *) host_url="https://${host_url}" ;;
          esac
          if [[ ! "${host_url}" =~ ^https?://[^[:space:]/]+ ]]; then
            echo "SONAR_HOST_URL must be a valid HTTP(S) URL"
            exit 1
          fi
          echo "host_url=${host_url}" >> "${GITHUB_OUTPUT}"

      - name: Upload SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-config.outputs.host_url }}
        with:
          args: >
            -Dsonar.php.coverage.reportPaths=build/coverage/clover-combined.xml
